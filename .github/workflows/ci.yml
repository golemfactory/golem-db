name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      # Picks up the `channel` pinned in rust-toolchain.toml.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo build --workspace --all-targets --all-features
      # Every feature combination each crate defines (none, custom_types
      # alone, and so on), not just the default build.
      - run: cargo hack nextest run --workspace --feature-powerset
      - run: cargo test --workspace --all-features --doc

  bench-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace --all-features --no-run
