[workspace]
resolver = "2"
members = ["crates/cells", "crates/merkle"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Internal crates, referenced by member crates as `{ workspace = true }`.
golemdb-cells = { path = "crates/cells", version = "0.1.0" }
golemdb-merkle = { path = "crates/merkle", version = "0.1.0" }

# Common external dependencies.
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
criterion = "0.5"
proptest = "1"
digest = "0.10"
sha2 = "0.10"
