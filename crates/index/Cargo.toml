[package]
name = "golemdb-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
golemdb-cells.workspace = true
golemdb-merkle.workspace = true
golemdb-storage.workspace = true
thiserror.workspace = true
# Pinned exactly, not `0.11`. Roaring's internal representation rules — the 4096
# array/bitset threshold, `optimize()`'s size comparisons, the serialized header
# layout — decide the bytes we hash into the Merkle trie, and none of them are
# covered by its public API contract. A patch bump can therefore change every root
# hash. Treat raising this as a coordinated migration, not a `cargo update`.
# See internal_docs/DESIGN.md §2.6.
roaring = "=0.11.5"

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
tempfile = "3"

[features]
default = []
mdbx = ["golemdb-storage/mdbx"]
# Parse custom cells, but reject their indexing until an ordered codec is defined.
custom_types = ["golemdb-cells/custom_types"]

[[bench]]
name = "index"
harness = false
