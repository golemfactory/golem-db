[package]
name = "golemdb-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
mdbx = ["golemdb-storage/mdbx"]
# The lower-level opening layer (open_store, OpenedStore) for trusted tooling and
# this crate's own tests. Not part of the normal API.
internals = []

[dependencies]
golemdb-cells.workspace = true
golemdb-branch.workspace = true
golemdb-record.workspace = true
golemdb-storage.workspace = true
golemdb-merkle.workspace = true
golemdb-index.workspace = true
serde.workspace = true
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
thiserror.workspace = true

[dev-dependencies]
# The integration tests use the lower-level opening layer.
golemdb-api = { path = ".", features = ["internals"] }
tempfile = "3"
